apply plugin: 'com.android.application'

android {
    namespace 'com.zip2apk.wrapper'
    compileSdk 34

    defaultConfig {
        applicationId "com.zip2apk.wrapper"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
